name: Modelr
options:
  bundleIdPrefix: com.zimeng
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Hy3DMLX:
    path: Packages/Hy3DMLX
  HunyuanPaintMLX:
    path: Packages/HunyuanPaintMLX

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple silicon only: MLX/Metal and Float16 paths do not build for x86_64.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"
  configs:
    # Debug ad-hoc signs so a machine without the team certificate can build.
    debug:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
    release:
      DEVELOPMENT_TEAM: "W9C2P3N7Q2"
      # This is intentionally an Apple Development certificate for the first
      # release. GitHub Actions imports it from the release secrets.
      CODE_SIGN_IDENTITY: "Apple Development"

targets:
  Modelr:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
      - Resources/Assets.xcassets
    dependencies:
      - package: Hy3DMLX
        product: Hy3DMLX
      - package: HunyuanPaintMLX
        product: HunyuanPaintMLX
    settings:
      base:
        PRODUCT_NAME: Modelr
        PRODUCT_BUNDLE_IDENTIFIER: com.zimeng.Modelr
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Modelr
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.graphics-design"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Zimeng"
        INFOPLIST_KEY_NSHighResolutionCapable: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Pure-logic tests: the deterministic core compiles directly into the bundle
  # (no TEST_HOST), so `xcodebuild test` runs headless — no app launch, no GPU.
  ModelrTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tests
      - Sources/Core
      # Storage-layer files under test (no MLX/engine deps) — the ProjectStore
      # round-trip needs Models + its viewer/image helpers to compile.
      - Sources/Models.swift
      - Sources/ProjectStore.swift
      - Sources/MeshViewer.swift
      - Sources/SculptView.swift
      - Sources/BackgroundRemover.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zimeng.ModelrTests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Modelr:
    build:
      targets:
        Modelr: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ModelrTests
    archive:
      config: Release
